<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DALL-E Image Playground</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea,
        button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
            outline: none;
        }

        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #imageContainer {
            margin-top: 20px;
            text-align: center;
        }

        img {
            max-width: 100%;
            border-radius: 5px;
            margin-top: 10px;
        }

        p.error {
            color: #ff4d4d;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>DALL-E Image Generator</h1>

        <form id="promptForm">
            <label for="prompt">Enter Prompt:</label>
            <textarea id="prompt" rows="3" required></textarea>
            <button type="button" onclick="generateImage()">Generate Image</button>
        </form>

        <form id="variationForm" enctype="multipart/form-data" style="margin-top: 20px;">
            <label for="variationImage">Upload Image for Variation:</label>
            <input type="file" id="variationImage" accept="image/png">
            <button type="button" onclick="generateVariation()">Generate Variation</button>
        </form>

        <div id="imageContainer"></div>
    </div>

    <script>
        function displayImages(urls) {
            const container = document.getElementById('imageContainer');
            container.innerHTML = '';
            urls.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                container.appendChild(img);
            });
        }

        function displayError(error) {
            const container = document.getElementById('imageContainer');
            container.innerHTML = `<p class="error">${error}</p>`;
        }

        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            const data = await response.json();
            if (data.success) {
                displayImages(data.data);
            } else {
                displayError(data.error);
            }
        }

        async function generateVariation() {
            const imageFile = document.getElementById('variationImage').files[0];
            const formData = new FormData();
            formData.append('image', imageFile);

            const response = await fetch('/generate-variation', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                displayImages(data.data);
            } else {
                displayError(data.error);
            }
        }
    </script>
</body>

</html>
